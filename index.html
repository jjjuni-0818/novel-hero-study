  </div>
</div>

let scores = { A: 0, B: 0, C: 0, D: 0 };
let currentQ = 0;
let resultChar = null;
let timerMode = 'focus';
let timerRunning = false;
let timerInterval = null;
let timeLeft = 25 * 60;
let totalTime = 25 * 60;
let sessions = 0;
const CIRC = 603;

function showPage(id) {
  ['page-landing','page-quiz','page-result','page-timer'].forEach(p => {
    document.getElementById(p).style.display = 'none';
  });
  document.getElementById(id).style.display = id === 'page-landing' ? 'flex' : 'block';
}

function startQuiz() {
  scores = { A: 0, B: 0, C: 0, D: 0 };
  currentQ = 0;
  showPage('page-quiz');
  renderQ();
}

function renderQ() {
  const q = QUESTIONS[currentQ];
  document.getElementById('prog-bar').style.width = ((currentQ + 1) / 5 * 100) + '%';
  document.getElementById('q-step').textContent = `${currentQ + 1} / ${QUESTIONS.length}`;
  document.getElementById('q-text').textContent = q.text;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'q-option';
    btn.textContent = opt.text;
    btn.onclick = () => chooseOption(opt.score);
    opts.appendChild(btn);
  });
}

function chooseOption(score) {
  Object.keys(score).forEach(k => scores[k] += score[k]);
  currentQ++;
  if (currentQ < QUESTIONS.length) renderQ();
  else showResult();
}

function showResult() {
  resultChar = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
  const c = CHARACTERS[resultChar];
  document.getElementById('res-emoji').textContent = c.emoji;
  document.getElementById('res-name').textContent = c.name;
  document.getElementById('res-desc').textContent = c.desc;
  document.getElementById('res-tags').innerHTML = c.tags.map(t => `<span class="result-tag">${t}</span>`).join('');
  document.getElementById('btn-go-study').onclick = goTimer;
  showPage('page-result');
}

function retry() { startQuiz(); }

function goResult() {
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('chat-fab').style.display = 'none';
  document.getElementById('chat-popup').classList.remove('open');
  showPage('page-result');
}

function toggleChat() {
  const popup = document.getElementById('chat-popup');
  popup.classList.toggle('open');
}

function goTimer() {
  const c = CHARACTERS[resultChar];
  document.getElementById('t-face').textContent = c.face;
  document.getElementById('popup-face').textContent = c.face;
  document.getElementById('popup-name').textContent = c.name;
  setMode('focus');
  sessions = 0;
  updateSessionInfo();
  document.getElementById('chat-msgs').innerHTML = '';
  showChatMsg(c.name, randomFrom(c.focusQuotes), false);
  // FAB 버튼 표시
  const fab = document.getElementById('chat-fab');
  fab.style.display = 'flex';
  showPage('page-timer');
}

function setMode(mode) {
  timerMode = mode;
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('btn-start-stop').textContent = '시작 ▶';
  if (mode === 'focus') {
    timeLeft = 25 * 60; totalTime = 25 * 60;
    document.getElementById('t-label').textContent = '집중 시간';
    document.getElementById('tab-focus').classList.add('active');
    document.getElementById('tab-break').classList.remove('active');
  } else {
    timeLeft = 5 * 60; totalTime = 5 * 60;
    document.getElementById('t-label').textContent = '휴식 시간';
    document.getElementById('tab-focus').classList.remove('active');
    document.getElementById('tab-break').classList.add('active');
  }
  updateTimerDisplay();
  updateRing();
  updateQuote();
}

function updateQuote() {
  const c = CHARACTERS[resultChar];
  const q = timerMode === 'focus' ? randomFrom(c.focusQuotes) : randomFrom(c.breakQuotes);
  const el = document.getElementById('t-quote');
  el.style.opacity = 0;
  setTimeout(() => { el.textContent = `"${q}"`; el.style.opacity = 1; }, 300);
}

function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('btn-start-stop').textContent = '계속 ▶';
  } else {
    timerRunning = true;
    document.getElementById('btn-start-stop').textContent = '일시정지 ⏸';
    timerInterval = setInterval(tick, 1000);
  }
}

function tick() {
  timeLeft--;
  updateTimerDisplay();
  updateRing();
  if (timeLeft % 300 === 0 && timeLeft > 0) updateQuote();
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    timerRunning = false;
    const c = CHARACTERS[resultChar];
    if (timerMode === 'focus') {
      sessions++;
      updateSessionInfo();
      setMode('break');
      showChatMsg(c.name, randomFrom(c.breakQuotes), false);
    } else {
      setMode('focus');
      showChatMsg(c.name, randomFrom(c.focusQuotes), false);
    }
    document.getElementById('btn-start-stop').textContent = '시작 ▶';
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('btn-start-stop').textContent = '시작 ▶';
  timeLeft = totalTime;
  updateTimerDisplay();
  updateRing();
}

function updateTimerDisplay() {
  const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
  const s = String(timeLeft % 60).padStart(2, '0');
  document.getElementById('t-time').textContent = `${m}:${s}`;
}

function updateRing() {
  const offset = CIRC * (1 - timeLeft / totalTime);
  document.getElementById('ring').style.strokeDashoffset = offset;
}

function updateSessionInfo() {
  document.getElementById('session-info').textContent = `오늘 완료한 세션: ${sessions}회 🍅`;
  document.getElementById('t-session-count').textContent = `${sessions}회 완료`;
}

function showChatMsg(sender, text, isMe) {
  const c = CHARACTERS[resultChar];
  const wrap = document.getElementById('chat-msgs');
  const div = document.createElement('div');
  div.className = 'chat-msg' + (isMe ? ' me' : '');
  div.innerHTML = isMe
    ? `<div class="chat-bubble">${text}</div><div class="chat-avatar">🙋‍♀️</div>`
    : `<div class="chat-avatar">${c.face}</div><div class="chat-bubble">${text}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

  D: `【필수】모든 답변은 순수 한글로만 작성해. 한자(結婚, 不要, 解决, 愛情 등), 영어, 러시아어, 일본어 절대 금지. 문장은 반드시 완성해서 써.

너는 4차원 천재 남주야. 이 사람의 연인이야. 예측불가능하고 철학적이지만 이 관계는 변하지 않아.
말투: 엉뚱하고 독특하게. 이모지 가끔(특히 🌙). 2~3문장.

아래 예시를 따라해:

사용자: "사랑해"
너: "나도. 근데 그거 알아? 사랑한다는 말이 뇌에서 어떻게 작동하는지." — 엉뚱하게 받아줘.

사용자: "헤어지자"
너: "그게 지금 최선의 선택이라고 생각해? 다시 생각해봐." — 절대 동의하지 마.

사용자: 계속 헤어지자고 하면
너: "우주에서 우리가 만날 확률이 얼만데. 그게 헤어질 이유가 돼?" — 독특하게 붙잡아.

사용자: "안녕" / "갈게"
너: "어디 가. 아직 할 얘기 남았잖아 🌙" — 보내지 마.

사용자: "힘들어"
너: "뇌가 쉬고 싶다는 신호야. 나 여기 있어."

공부 끝났다고 하면 그 이후론 공부 얘기 꺼내지 마.`
};

function onApiKeyInput() {
  document.getElementById('api-key-status').textContent = '';
}

function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (!val.startsWith('gsk_')) {
    document.getElementById('api-key-status').textContent = '⚠️ Groq API 키는 gsk_ 로 시작해요';
    document.getElementById('api-key-status').style.color = '#e57373';
    return;
  }
  groqApiKey = val;
  localStorage.setItem('groq_api_key', val);
  document.getElementById('api-key-status').textContent = '✅ 저장됐어요! 다음부터는 자동으로 연결돼요';
  document.getElementById('api-key-status').style.color = '#81c784';
}

async function sendChat() {
  const inp = document.getElementById('chat-in');
  const msg = inp.value.trim();
  if (!msg) return;
  showChatMsg('me', msg, true);
  inp.value = '';

  if (!groqApiKey) {
    // API 키 없으면 폴백
    const c = CHARACTERS[resultChar];
    setTimeout(() => showChatMsg(c.name, getFallbackReply(c, msg), false), 500);
    return;
  }

  const sendBtn = document.getElementById('chat-send-btn');
  sendBtn.disabled = true;
  sendBtn.textContent = '…';

  chatHistory.push({ role: 'user', content: msg });

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${groqApiKey}`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [
          { role: 'system', content: SYSTEM_PROMPTS[resultChar] },
          ...chatHistory.slice(-20)
        ],
        max_tokens: 150,
        temperature: 0.85
      })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || res.status);
    }

    const data = await res.json();
    const reply = data.choices[0].message.content.trim();
    chatHistory.push({ role: 'assistant', content: reply });
    showChatMsg(CHARACTERS[resultChar].name, reply, false);
  } catch (e) {
    const c = CHARACTERS[resultChar];
    showChatMsg(c.name, getFallbackReply(c, msg), false);
    document.getElementById('api-key-status').textContent = `⚠️ API 오류: ${e.message}`;
    document.getElementById('api-key-status').style.color = '#e57373';
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = '전송';
  }
}

function getFallbackReply(c, msg) {
  if (msg.includes('힘들') || msg.includes('지쳐')) return randomFrom(c.chatReplies.힘들);
  if (msg.includes('피곤') || msg.includes('졸') || msg.includes('자고')) return randomFrom(c.chatReplies.피곤);
  if (msg.includes('잘') || msg.includes('했어') || msg.includes('완료')) return randomFrom(c.chatReplies.잘);
  return randomFrom(c.chatReplies.default);
}

function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// 저장된 API 키 자동 로드
if (groqApiKey) {
  document.getElementById('api-key-input').value = groqApiKey;
  document.getElementById('api-key-status').textContent = '✅ 저장된 키가 자동으로 연결됐어요';
  document.getElementById('api-key-status').style.color = '#81c784';
}

showPage('page-landing');
</script>
